services:
  promo-service:
    build: .
    container_name: promo-service
    restart: unless-stopped
    ports:
      - "8092:8092"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@promo-db:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      promo-db:
        condition: service_healthy
    networks:
      - microservices-net

  promo-db:
    image: postgres:17-alpine
    container_name: promo-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5440:5432"
    volumes:
      - promo_data:/var/lib/postgresql/data
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  microservices-net:
    external: true
volumes:
  promo_data:
